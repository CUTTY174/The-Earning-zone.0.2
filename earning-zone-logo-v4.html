<title>THE EARNING ZONE - Join Telegram</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 25%,#1b1840 0%,#0d0c1d 55%,#06060e 100%);color:#fff;padding:24px 20px;text-align:center}
.container{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center}
.profile-wrapper{width:230px;height:230px;margin-bottom:26px;filter:drop-shadow(0 0 18px rgba(124,108,240,.8)) drop-shadow(0 0 48px rgba(114,99,232,.65))}
.profile-img{width:100%;height:100%;object-fit:contain;display:block;border-radius:50%}
.title-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:24px}
.channel-name{font-size:24px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}
.verified-badge{width:24px;height:24px;flex-shrink:0;filter:drop-shadow(0 0 6px rgba(114,99,232,.6))}
.join-btn{width:100%;max-width:340px;display:flex;align-items:center;justify-content:center;gap:14px;padding:14px 24px;border-radius:50px;background:linear-gradient(90deg,#6b66d6,#7c75e8 50%,#6862cf);color:#fff;text-decoration:none;font-size:16px;font-weight:700;letter-spacing:.8px;box-shadow:0 8px 24px rgba(107,102,214,.38);transition:transform .15s ease;margin-bottom:34px}
.join-btn:active{transform:scale(.97)}
.tg-icon-circle{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tg-icon-circle svg{width:18px;height:18px;fill:#6b66d6;margin-right:2px}
.disclaimer-box{max-width:310px;margin-bottom:26px}
.disclaimer-title{font-size:11px;font-weight:700;letter-spacing:2px;color:#b8b8c7;margin-bottom:8px}
.disclaimer-text{font-size:12.5px;line-height:1.55;color:#9e9eb0}
.managed-by{font-size:12px;color:#9e9eb0;letter-spacing:.4px;margin-bottom:14px}
.managed-by span{font-weight:700;letter-spacing:1px;color:#c5c5d4}
.privacy-link{font-size:12.5px;color:#9e9eb0;text-decoration:underline;text-underline-offset:3px}
</style>
